packages:
  - apps/*
  - packages/*
  - plugins/*
  - plugins/kilo-ui/opencode-sdk-compat
  - e2e

catalog:
  atomically: ^2.1.1
  electron: 43.4.0
  lodash: ^4.17.21
  type-fest: ^5.8.0
  typescript: ^7.0.2
  vite: ^8.1.5
  vitest: 5.0.0-rc.1
  zod: ^4.4.3

savePrefix: ^

nodeLinker: hoisted
injectWorkspacePackages: true
autoInstallPeers: false

overrides:
  "@assistant-ui/react-opencode>@opencode-ai/sdk": "link:plugins/kilo-ui/opencode-sdk-compat"
  # Keep react-opencode on the same core/store as @assistant-ui/react so Vite
  # does not embed a second AssistantContext (breaks composer typing).
  "@assistant-ui/core": "0.3.5"
  "@assistant-ui/store": "0.3.9"
  "@assistant-ui/tap": "0.9.12"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  better-sqlite3: true
  "@scarf/scarf": true
  fs-xattr: true
  macos-alias: true
  "@github/keytar": true
  "@anaconda/playwright-utils": false
  unrs-resolver: false
  # Optional native addon pulled in transitively by @vscode/proxy-agent. We
  # never load it (addCertificatesV2 → false), so skip its native build.
  "@vscode/windows-ca-certs": false

minimumReleaseAge: 0

registries:
  default: https://registry.npmjs.org/
  "@anaconda": https://npm.pkg.github.com/

patchedDependencies:
  "@assistant-ui/react-opencode@0.2.17": plugins/kilo-ui/patches/@assistant-ui__react-opencode@0.2.17.patch
