name: Cache notebook native resources
description: Restore the platform-specific runtimed executable and staged notebook UI used by packaged notebook builds.

runs:
  using: composite
  steps:
    - name: Cache notebook runtime binaries
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          plugins/notebook/resources/runtimed
          plugins/notebook/build/notebook
        key: notebook-resources-${{ runner.os }}-${{ hashFiles('plugins/notebook/src/packaging/artifacts.ts') }}
