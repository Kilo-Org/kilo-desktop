name: Release

on:
  push:
    tags:
      - "v*.*.*"
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      track:
        description: Release track
        required: true
        default: stable
        type: choice
        options:
          - preview
          - stable
      version:
        description: Stable version, for example 1.2.3 or 1.2.3-alpha.1
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'schedule' && 'preview' || inputs.track || 'stable' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      release_track: ${{ steps.release.outputs.release_track }}
      release_version: ${{ steps.release.outputs.release_version }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release track and version
        id: release
        shell: bash
        env:
          DISPATCH_TRACK: ${{ inputs.track }}
          DISPATCH_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$DISPATCH_TRACK" == "preview" ]]; then
            if [[ -n "${DISPATCH_VERSION:-}" ]]; then
              echo "Preview releases derive their version automatically; leave version empty." >&2
              exit 1
            fi
            echo "release_track=preview" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            raw_version="$GITHUB_REF_NAME"
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Stable release tags must point to a commit on main." >&2
              exit 1
            fi
          else
            if [[ "$DISPATCH_TRACK" != "stable" ]]; then
              echo "Unsupported release track: $DISPATCH_TRACK" >&2
              exit 1
            fi
            if [[ "$GITHUB_REF_NAME" != "main" ]]; then
              echo "Stable releases must be dispatched from main." >&2
              exit 1
            fi
            raw_version="$DISPATCH_VERSION"
          fi

          version="${raw_version#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview-[0-9]{6}-[0-9]{5}$ ]]; then
            echo "Preview tags are created by Preview release runs and cannot trigger Stable publication." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Stable releases require X.Y.Z or X.Y.Z-prerelease." >&2
            exit 1
          fi
          prerelease="${version#*-}"
          if [[ "$prerelease" != "$version" && ${#prerelease} -gt 20 ]]; then
            echo "Stable prerelease identifiers must be at most 20 characters for Squirrel.Windows." >&2
            exit 1
          fi
          if [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != "push" ]] && git rev-parse "v$version" >/dev/null 2>&1; then
              echo "Stable tag v$version already exists. Retry its original workflow run to recover a partial publication." >&2
              exit 1
            fi
            set +e
            release_lookup=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1)
            release_lookup_status=$?
            set -e
            if [[ "$release_lookup_status" == "0" ]]; then
              echo "Stable release v$version already exists. Retry its original workflow run to recover a partial publication." >&2
              exit 1
            fi
            if [[ "$release_lookup" != *"HTTP 404"* ]]; then
              echo "Could not verify whether Stable release v$version exists: $release_lookup" >&2
              exit 1
            fi
          fi
          echo "release_track=stable" >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for changes since the latest Preview
        id: changes
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_preview_tag=$(git tag --list 'v*-preview-*' --sort=-creatordate | head -n 1)
          if [[ -z "$latest_preview_tag" ]]; then
            echo "No previous Preview release found. Proceeding."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(git rev-parse "$latest_preview_tag^{commit}")" == "$(git rev-parse HEAD)" ]]; then
            echo "No changes since $latest_preview_tag. Skipping Preview release."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected since $latest_preview_tag."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish_helper.yml
    secrets: inherit
    with:
      release_track: ${{ needs.preflight.outputs.release_track }}
      release_version: ${{ needs.preflight.outputs.release_version }}
      fail_fast: ${{ needs.preflight.outputs.release_track == 'stable' }}

  finalize:
    name: Finalize Stable version
    needs: [preflight, publish]
    if: needs.preflight.outputs.release_track == 'stable' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release app identity
        id: app-bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Update release package versions
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: pnpm --filter @kilo-desktop/desktop exec tsx config/desktop-version.ts "$RELEASE_VERSION"

      - name: Refresh release lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit Stable version
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          if git diff --quiet -- apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "${{ steps.app-bot.outputs.name }}"
          git config user.email "${{ steps.app-bot.outputs.email }}"
          git add apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml
          git commit -m "chore(release): prepare v$RELEASE_VERSION"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 2))
            fi
          done
          echo "Failed to push the Stable version after 3 attempts." >&2
          exit 1
