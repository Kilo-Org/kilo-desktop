packages:
  - apps/*
  - packages/*
  - plugins/*
  - e2e

catalog:
  atomically: ^2.1.1
  electron: 43.2.0
  lodash: ^4.17.21
  typescript: ^7.0.2
  vite: ^8.1.5
  vitest: 5.0.0-beta.7
  zod: ^4.4.3

savePrefix: ^

nodeLinker: hoisted
injectWorkspacePackages: true
autoInstallPeers: false

overrides:
  "@assistant-ui/react-opencode>@opencode-ai/sdk": "link:packages/kilo-opencode-sdk-compat"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  better-sqlite3: true
  "@scarf/scarf": true
  fs-xattr: true
  macos-alias: true
  "@github/keytar": true
  "@anaconda/playwright-utils": false
  unrs-resolver: false
  # Optional native addon pulled in transitively by @vscode/proxy-agent. We
  # never load it (addCertificatesV2 → false), so skip its native build.
  "@vscode/windows-ca-certs": false

minimumReleaseAge: 0

registries:
  default: https://registry.npmjs.org/
  "@anaconda": https://npm.pkg.github.com/
