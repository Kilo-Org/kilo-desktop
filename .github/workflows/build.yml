# Manual Electron Forge make — artifacts only, no S3 publish.
# Uses the canary GitHub Environment so optional signing secrets/vars resolve
# the same way as Canary Publish.

name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        required: true
        default: mac
        type: choice
        options:
          - mac
          - windows
          - linux
          - all

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ inputs.platform == 'all' && fromJSON('["mac","windows","linux"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.target == 'mac' && 'macos-latest' || matrix.target == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 90
    environment: canary
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
      RELEASE_CHANNEL: canary
      UPDATE_PUBLISH_URL: ${{ vars.UPDATE_PUBLISH_URL }}
      AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
      AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install maker prerequisites
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot libsecret-1-dev pkg-config

      - name: Setup macOS code signing
        if: matrix.target == 'mac'
        uses: ./.github/actions/setup-macos-codesign
        with:
          certificate_base64: ${{ secrets.OSX_BUILD_CERTIFICATE_BASE64 }}
          certificate_password: ${{ secrets.OSX_P12_PASSWORD }}
          notarization_key: ${{ secrets.OSX_NOTARIZATION_KEY }}
          notarization_key_id: ${{ secrets.OSX_NOTARIZATION_KEY_ID }}
          notarization_key_issuer: ${{ secrets.OSX_NOTARIZATION_KEY_ISSUER }}

      - name: Setup Windows code signing
        if: matrix.target == 'windows'
        uses: ./.github/actions/setup-windows-codesign
        with:
          client_id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          key_vault_uri: ${{ secrets.AZURE_KEY_VAULT_URI }}
          cert_name: ${{ secrets.AZURE_CERT_NAME }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make
        run: pnpm run make

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target == 'mac' && 'mac-arm64' || format('{0}-x64', matrix.target) }}
          path: |
            apps/desktop/out/make/**/*.dmg
            apps/desktop/out/make/**/*.zip
            apps/desktop/out/make/**/RELEASES.json
            apps/desktop/out/make/**/*.exe
            apps/desktop/out/make/**/*.nupkg
            apps/desktop/out/make/**/RELEASES
            apps/desktop/out/make/**/*.deb
          if-no-files-found: error
          retention-days: 7
