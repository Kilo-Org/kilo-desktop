name: Cache notebook native resources
description: >
  Restore the platform-specific runtimed and nteract-mcp executables used by
  packaged notebook builds.

runs:
  using: composite
  steps:
    - name: Cache notebook runtime binaries
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          plugins/notebook/resources/nteract-mcp
          plugins/notebook/resources/runtimed
        key: notebook-resources-${{ runner.os }}-${{ hashFiles('plugins/notebook/src/packaging/artifacts.ts') }}
