name: Turbo Cache
description: Restore and save the Turborepo local file cache between CI runs.

inputs:
  key-suffix:
    description: >
      Distinguishes jobs of one run that cache different tasks (e.g. test
      shards), so each saves its own entry instead of the first one winning.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}-${{ github.sha }}${{ inputs.key-suffix && format('-{0}', inputs.key-suffix) || '' }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-${{ runner.arch }}-
