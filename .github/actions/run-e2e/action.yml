name: Run Electron e2e
description: >
  Package the desktop app for Playwright (inspect fuse enabled) and run the
  e2e suite. Callers must set NODE_AUTH_TOKEN / ANACONDA_NPM_TOKEN.

inputs:
  script:
    description: e2e package script to run (test:e2e or test:e2e:smoke).
    required: false
    default: test:e2e
  grep:
    description: >
      Optional Playwright grep pattern (see e2e/scripts/select-pr-e2e.ts),
      passed as E2E_GREP. Use with the unfiltered test:e2e script.
    required: false
    default: ""
  shard:
    description: Optional Playwright shard as "current/total" (e.g. 1/2), passed as E2E_SHARD.
    required: false
    default: ""
  xvfb:
    description: Wrap the test command in xvfb-run (Linux CI).
    required: false
    default: "false"
  report-name:
    description: Artifact name for the Playwright HTML report.
    required: false
    default: playwright-report
  upload-on:
    description: When to upload the report artifact (failure or always).
    required: false
    default: failure

runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-test-runtime
      with:
        runtime: electron
        package-name: "@kilo-desktop/desktop"

    # Specs drive the packaged app through `_electron.launch` and never open a
    # Playwright browser, so no Chromium download. Linux still needs the
    # system libraries Electron loads under xvfb, which the same installer
    # provides. (On Windows, --with-deps would run a slow DISM install.)
    - if: runner.os == 'Linux'
      uses: ./.github/actions/install-test-runtime
      with:
        runtime: playwright-deps
        package-name: "@kilo-desktop/e2e"

    - uses: ./plugins/notebook/actions/setup-native

    - uses: ./plugins/agent/actions/setup-cli

    - name: Package desktop for e2e
      shell: bash
      run: pnpm --filter @kilo-desktop/desktop run package:e2e

    - name: Run e2e
      shell: bash
      env:
        SKIP_BUILD: "true"
        E2E_GREP: ${{ inputs.grep }}
        E2E_SHARD: ${{ inputs.shard }}
      run: |
        if [ "${{ inputs.xvfb }}" = "true" ]; then
          xvfb-run --auto-servernum pnpm --filter @kilo-desktop/e2e run ${{ inputs.script }}
        else
          pnpm --filter @kilo-desktop/e2e run ${{ inputs.script }}
        fi

    - name: Upload Playwright results
      if: ${{ inputs.upload-on == 'always' || failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-name }}
        path: |
          playwright-report/
          blob-report/
          test-results/
        if-no-files-found: warn
        retention-days: 30
