name: Publish Helper

on:
  workflow_call:
    inputs:
      release_track:
        description: Publishable release track (preview or stable)
        required: true
        type: string
      release_version:
        description: Explicit Stable version; empty for Preview
        required: false
        type: string
      preview_build_time:
        description: Shared UTC build time used to version every Preview artifact
        required: false
        type: string
      fail_fast:
        description: Cancel remaining matrix legs when one fails
        required: false
        type: boolean
        default: true
      generate_sbom:
        description: Generate SBOMs of the published packaged apps and attach them to the GitHub release
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-${{ inputs.release_track }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    environment: ${{ inputs.release_track == 'stable' && 'production' || 'preview' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      # `target` names the uploaded artifact; `os` selects per-OS setup steps.
      # Forge builds for the runner's own arch, so each arch needs a native runner.
      matrix:
        include:
          - target: mac
            os: mac
            runner: blacksmith-6vcpu-macos-latest
            timeout_minutes: 90
          - target: windows
            os: windows
            runner: blacksmith-8vcpu-windows-2025
            timeout_minutes: 60
          - target: windows-arm64
            os: windows
            runner: windows-11-vs2026-arm
            timeout_minutes: 90
          - target: linux
            os: linux
            runner: blacksmith-4vcpu-ubuntu-2404
            timeout_minutes: 60
          - target: linux-arm64
            os: linux
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            timeout_minutes: 60
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      RELEASE_TRACK: ${{ inputs.release_track }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      PREVIEW_BUILD_TIME: ${{ inputs.preview_build_time }}
      UPDATE_PUBLISH_URL: ${{ vars.UPDATE_PUBLISH_URL }}
      UPDATE_PUBLISH_URL_PREVIEW: ${{ vars.UPDATE_PUBLISH_URL_PREVIEW }}
      UPDATE_PUBLISH_URL_STABLE: ${{ vars.UPDATE_PUBLISH_URL_STABLE }}
      UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
      AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      # Service IDs for official builds (see docs/releases.md); not committed.
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_BRIDGE_SENTRY_DSN: ${{ vars.VITE_BRIDGE_SENTRY_DSN }}
      VITE_LAUNCHDARKLY_CLIENT_SIDE_ID: ${{ vars.VITE_LAUNCHDARKLY_CLIENT_SIDE_ID }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require service configuration
        uses: ./.github/actions/require-service-config

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Linux maker prerequisites
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential fakeroot libsecret-1-dev pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align release package versions
        run: pnpm --filter @kilo-desktop/desktop exec tsx config/desktop-version.ts

      - name: Refresh release lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - uses: ./plugins/notebook/actions/setup-native

      - uses: ./plugins/agent/actions/setup-cli

      - uses: ./.github/actions/cache-electron-rebuild

      # Signing material is loaded after dependency install so package install
      # scripts never run with the certificate, notarization key or Azure login.
      - name: Setup macOS code signing
        if: matrix.os == 'mac'
        uses: ./.github/actions/setup-macos-codesign
        with:
          certificate_base64: ${{ secrets.OSX_BUILD_CERTIFICATE_BASE64 }}
          certificate_password: ${{ secrets.OSX_P12_PASSWORD }}
          notarization_key: ${{ secrets.OSX_NOTARIZATION_KEY }}
          notarization_key_id: ${{ secrets.OSX_NOTARIZATION_KEY_ID }}
          notarization_key_issuer: ${{ secrets.OSX_NOTARIZATION_KEY_ISSUER }}

      - name: Setup Windows code signing
        if: matrix.os == 'windows'
        uses: ./.github/actions/setup-windows-codesign
        with:
          client_id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          key_vault_uri: ${{ secrets.AZURE_KEY_VAULT_URI }}
          cert_name: ${{ secrets.AZURE_CERT_NAME }}

      - name: Build release candidate
        env:
          # Source-map upload; both the `production` and `preview` environments
          # must define it, or that track's Sentry stack traces stay minified.
          # Step-scoped so dependency install scripts never see it.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm --filter @kilo-desktop/desktop run publish -- --dry-run

      - name: Smoke-test updater payload
        if: matrix.os != 'linux'
        run: pnpm --filter @kilo-desktop/desktop run release:smoke

      # Assumed only now so dependency install scripts and the build never run
      # with write access to the update buckets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@bb84b6db015d7c3d879540350fdc17b85d6ad362
        with:
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Publish tested release candidate
        run: pnpm --filter @kilo-desktop/desktop exec tsx config/run-packaging.ts publish --from-dry-run

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 7

      # Hands the exact signed app tree to the sbom job. tar keeps the .app
      # bundle's symlinks and modes, which upload-artifact drops. continue-on-error keeps
      # SBOM non-blocking: a failure here must not fail this leg, which on
      # Stable (fail_fast) would cancel the other platforms mid-publish.
      - name: Archive packaged app for SBOM
        if: inputs.generate_sbom
        continue-on-error: true
        shell: bash
        env:
          # macOS tar otherwise adds AppleDouble ._* entries for xattrs.
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          PACKAGED_DIR=$(find apps/desktop/out -mindepth 1 -maxdepth 1 -type d \
            \( -name "*-darwin-*" -o -name "*-win32-*" -o -name "*-linux-*" \) | head -n1)
          [[ -n "$PACKAGED_DIR" ]] || { echo "::error::no packaged app directory found under apps/desktop/out"; exit 1; }
          # Workspace-relative on purpose: Git Bash's GNU tar reads a Windows
          # path like D:\a\_temp\x.tar as a remote host:file archive.
          mkdir -p sbom-input
          tar -cf sbom-input/packaged.tar -C "$(dirname "$PACKAGED_DIR")" "$(basename "$PACKAGED_DIR")"
          # Already stamped by "Align release package versions", so Preview
          # SBOMs carry the full Preview version.
          node -p "require('./apps/desktop/package.json').version" > sbom-input/version

      - name: Upload packaged app for SBOM
        if: inputs.generate_sbom
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-${{ matrix.target }}
          path: sbom-input/
          if-no-files-found: error
          # Long enough to "Re-run failed jobs" on the sbom job after a weekend.
          retention-days: 3

  # Untrusted by design: runs third-party tools (Syft, Trivy, @electron/asar)
  # fetched at run time, with no secrets and a read-only token. Even without
  # secrets, any step here can upload workflow artifacts under any name, so
  # nothing published may consume what this job produces: release runs in
  # parallel and only downloads publish's exact artifact names, and
  # attach-sbom (our own steps only) accepts nothing but correctly named SBOM
  # files for the trusted release tag. Non-blocking: a failed leg only leaves
  # SBOMs off the release. Recover with "Re-run failed jobs" while the
  # packaged-* artifacts are retained; it reruns sbom and attach-sbom only.
  sbom:
    needs: publish
    if: ${{ !cancelled() && inputs.generate_sbom }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Keep in sync with the publish matrix.
      matrix:
        target: [mac, windows, windows-arm64, linux, linux-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packaged app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaged-${{ matrix.target }}
          path: ${{ runner.temp }}/sbom-input

      - name: Extract and locate packaged app
        id: packaged
        shell: bash
        run: |
          set -euo pipefail
          PACKAGED_ROOT="$RUNNER_TEMP/packaged"
          mkdir -p "$PACKAGED_ROOT"
          # The macOS archive carries libarchive xattr headers GNU tar does not know.
          tar --warning=no-unknown-keyword -xf "$RUNNER_TEMP/sbom-input/packaged.tar" -C "$PACKAGED_ROOT"
          APP_VERSION=$(cat "$RUNNER_TEMP/sbom-input/version") \
            bash .github/actions/generate-sbom/locate-packaged-app.sh "$PACKAGED_ROOT" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        id: sbom
        uses: ./.github/actions/generate-sbom
        with:
          scan-path: ${{ steps.packaged.outputs.app-dir }}
          sbom-name: ${{ steps.packaged.outputs.sbom-name }}
          asar-path: ${{ steps.packaged.outputs.asar-path }}
          upload-artifact: "false"
          fetch-remote-licenses: "true"

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.target }}
          path: |
            ${{ steps.sbom.outputs.cyclonedx-path }}
            ${{ steps.sbom.outputs.spdx-path }}
          if-no-files-found: error
          retention-days: 7

  release:
    # Must not depend on sbom: it collects and publishes artifacts before any
    # untrusted scanner runs. Known gap: re-running this job after sbom has run
    # trusts publish's artifacts by name only, and a compromised scanner could
    # have replaced them. Prefer a fresh release run over re-running release.
    needs: publish
    if: ${{ !cancelled() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: ${{ inputs.release_track == 'stable' && 'production' || 'preview' }}
    permissions:
      id-token: write
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      RELEASE_TRACK: ${{ inputs.release_track }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      PREVIEW_BUILD_TIME: ${{ inputs.preview_build_time }}
      UPDATE_PUBLISH_URL: ${{ vars.UPDATE_PUBLISH_URL }}
      UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_ARTIFACTS_DIR: ${{ github.workspace }}/release-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exact publish-matrix names, never a release-* wildcard: everything
      # downloaded here is published, and S3 trusts it by file extension.
      # Missing names are skipped, so a partial Preview still publishes.
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-{mac,windows,windows-arm64,linux,linux-arm64}
          path: release-artifacts

      # Assumed after dependency install so install scripts never hold bucket
      # write access.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@bb84b6db015d7c3d879540350fdc17b85d6ad362
        with:
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Create GitHub release and publish track aliases
        id: publish
        run: pnpm --filter @kilo-desktop/desktop exec tsx config/publish-track-release.ts

  # Attaches the sbom job's output to the published GitHub release. Only our
  # own steps run here (no checkout, no environment, no AWS); the tag comes
  # from the trusted release job, and every file must be a valid-JSON SBOM
  # named for that exact version or nothing is uploaded. Never touches S3.
  attach-sbom:
    needs: [release, sbom]
    if: ${{ !cancelled() && inputs.generate_sbom && needs.release.result == 'success' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-{mac,windows,windows-arm64,linux,linux-arm64}
          path: ${{ runner.temp }}/sboms
          merge-multiple: true

      - name: Attach SBOMs to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]] || { echo "::error::release job reported no tag"; exit 1; }
          SBOM_DIR="$RUNNER_TEMP/sboms"
          mkdir -p "$SBOM_DIR"
          VERSION="${RELEASE_TAG#v}"
          ESCAPED_VERSION=$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')
          NAME_PATTERN="^kilo-desktop_${ESCAPED_VERSION}_(darwin|win32|linux)-(x64|arm64)\\.sbom\\.(cyclonedx|spdx)\\.json$"
          ASSETS=()
          while IFS= read -r -d '' entry; do
            name=$(basename "$entry")
            [[ -f "$entry" && ! -L "$entry" && "$name" =~ $NAME_PATTERN ]] \
              || { echo "::error::refusing unexpected SBOM artifact entry: $name"; exit 1; }
            jq empty "$entry" || { echo "::error::$name is not valid JSON"; exit 1; }
            ASSETS+=("$entry")
          done < <(find "$SBOM_DIR" -mindepth 1 -print0)
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "::warning::no SBOMs to attach to $RELEASE_TAG"
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
