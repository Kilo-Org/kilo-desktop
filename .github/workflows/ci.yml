name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep real-git fixtures independent of the runner's global configuration.
  GIT_CONFIG_COUNT: "6"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: core.filemode
  GIT_CONFIG_VALUE_1: "false"
  GIT_CONFIG_KEY_2: core.longpaths
  GIT_CONFIG_VALUE_2: "true"
  GIT_CONFIG_KEY_3: commit.gpgsign
  GIT_CONFIG_VALUE_3: "false"
  GIT_CONFIG_KEY_4: tag.gpgsign
  GIT_CONFIG_VALUE_4: "false"
  GIT_CONFIG_KEY_5: init.defaultBranch
  GIT_CONFIG_VALUE_5: main

# One job per runner type saves the pnpm store on a lockfile change: lint-format
# on Linux and each `test` leg on Windows and macOS (under its own "platform"
# store scope, and only when main holds no full store for the lockfile yet).
# Every other job passes save-pnpm-store: "false" and only restores.
jobs:
  lint-format:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:scripts

  # Bundled plugins build outside the monorepo: manifests, exports and
  # declared dependencies for every plugin, then each one is copied with
  # `pnpm deploy` into a temporary folder and type-checked there.
  plugin-isolation:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          save-pnpm-store: "false"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:plugin-isolation --build all

  typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
    steps:
      # Depth 2: a PR checks out its merge commit, whose first parent (HEAD^1)
      # is the base it merges into. Without it turbo can't diff, and --affected
      # fell back to checking all 28 packages on every PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-node-pnpm
        with:
          save-pnpm-store: "false"
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/turbo-cache
      # PRs check the packages the diff affects and their dependents (global
      # inputs such as the lockfile or tsconfig.base.json affect every package);
      # the merge queue checks everything.
      # --concurrency=4: turbo's default of 10 parallel tsc runs exhausts the
      # 16 GB runner on a full (uncached) check; the kernel kills one (exit 137).
      - name: Typecheck
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            TURBO_SCM_BASE=HEAD^1 pnpm exec turbo run check --affected --concurrency=4
          else
            pnpm exec turbo run check --concurrency=4
          fi

  # Linux runs every Vitest tier (unit, integration, browser) in three shards,
  # split by recorded per-package duration (scripts/test-durations/coverage.json).
  # PRs run only the tests the diff can reach; lockfile, manifest, tsconfig and
  # test-config changes widen that to full suites (scripts/test-changed.mjs).
  # The merge queue runs every package's full suite with the 80% coverage gate.
  test-linux:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    concurrency:
      group: test-linux-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      GIT_CONFIG_NOSYSTEM: "true"
    steps:
      - name: Isolate git config
        shell: bash
        run: |
          : > "$RUNNER_TEMP/kilo-test-gitconfig"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/kilo-test-gitconfig" >> "$GITHUB_ENV"
      # Depth 2: a PR checks out its merge commit, whose first parent (HEAD^1)
      # is the base it merges into — the base for change selection.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-node-pnpm
        with:
          save-pnpm-store: "false"
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/turbo-cache
        with:
          key-suffix: linux-${{ matrix.shard }}
          vitest: "true"
      - uses: ./.github/actions/install-test-runtime
        with:
          runtime: electron
          package-name: "@kilo-desktop/desktop"
      - uses: ./.github/actions/install-test-runtime
        with:
          runtime: playwright
          package-name: "@kilo-desktop/web"
      - name: Run the tests this PR can reach
        if: github.event_name == 'pull_request'
        run: node scripts/test-changed.mjs HEAD^1 --shard ${{ matrix.shard }}/3 --concurrency 2
      - name: Run every package with the coverage gate
        if: github.event_name != 'pull_request'
        run: node scripts/test-changed.mjs --all --task coverage --shard ${{ matrix.shard }}/3 --concurrency 2

  # Keeps the Linux leg's name, the required branch-protection check, now that
  # its work is sharded across test-linux.
  test-linux-gate:
    name: test (blacksmith-4vcpu-ubuntu-2404)
    if: always()
    needs: test-linux
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Verify Linux test shards
        shell: bash
        env:
          RESULT: ${{ needs.test-linux.result }}
        run: |
          echo "test-linux: $RESULT"
          [[ "$RESULT" == "success" ]]

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-8vcpu-windows-2025, blacksmith-6vcpu-macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    concurrency:
      # Windows runners contend over native modules and SQLite files.
      group: test-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      GIT_CONFIG_NOSYSTEM: "true"
      # The packages with real Git and filesystem checks per platform.
      PLATFORM_PACKAGES: >-
        @kilo-desktop/git-client
        @kilo-desktop/plugin-core
        @kilo-desktop/plugin-git
        @kilo-desktop/plugin-notebook
        @kilo-desktop/plugin-work-sessions
    steps:
      # Job-level env cannot use the runner context, so pin GIT_CONFIG_GLOBAL
      # here before checkout. An empty writable file (not /dev/null) lets
      # `git config --global` writes such as checkout's safe.directory succeed
      # without touching the runner's real gitconfig.
      - name: Isolate git config
        shell: bash
        run: |
          : > "$RUNNER_TEMP/kilo-test-gitconfig"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/kilo-test-gitconfig" >> "$GITHUB_ENV"
      # Depth 2 for --affected below (see typecheck).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # Only these packages and their dependencies (12 of 29 projects, ~900 of
      # ~1,400 packages): linking the whole workspace was most of this job's
      # time on Windows. The root project comes along, with turbo and vitest.
      - uses: ./.github/actions/setup-node-pnpm
        with:
          store-scope: platform
      - name: Install the platform-tested packages
        shell: bash
        run: |
          filters=()
          for package in $PLATFORM_PACKAGES; do filters+=("--filter=$package..."); done
          pnpm install --frozen-lockfile "${filters[@]}"
      - uses: ./.github/actions/turbo-cache
        with:
          vitest: "true"
      # Coverage, including browser projects, runs in test-linux. These legs
      # keep checks for real Git and filesystem behavior per platform, as
      # Turbo-managed tasks: cached, and the packages run concurrently. PRs run
      # only the packages the diff affects (--affected intersects the filters);
      # the merge queue runs all of them.
      - name: Run platform compatibility tests
        shell: bash
        run: |
          filters=()
          for package in $PLATFORM_PACKAGES; do filters+=("--filter=$package"); done
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            TURBO_SCM_BASE=HEAD^1 pnpm exec turbo run test:platform --affected "${filters[@]}"
          else
            pnpm exec turbo run test:platform "${filters[@]}"
          fi

  # Plans PR e2e before any runner packages the app: the specs the diff can
  # reach (e2e/scripts/select-pr-e2e.ts) and a shard count sized by their
  # recorded test time (plan-pr-e2e.ts). Docs-, test- and CI-only PRs plan
  # zero shards and skip PR e2e; the merge queue still runs everything.
  e2e-plan:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      grep: ${{ steps.plan.outputs.grep }}
      total: ${{ steps.plan.outputs.total }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Plan e2e for the changed areas
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD | node e2e/scripts/plan-pr-e2e.ts

  # PR e2e runs on Linux (xvfb): setup, install and packaging there take
  # ~15 s where Windows took 55-100 s per shard. Windows e2e coverage comes
  # from the merge queue (e2e-merge) and nightly.
  e2e-pr:
    needs: e2e-plan
    if: github.event_name == 'pull_request' && needs.e2e-plan.outputs.total != '0'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      PLAYWRIGHT_FAIL_ON_FLAKY_TESTS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          save-pnpm-store: "false"
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/run-e2e
        with:
          script: test:e2e
          xvfb: "true"
          grep: ${{ needs.e2e-plan.outputs.grep }}
          shard: ${{ matrix.shard }}/${{ needs.e2e-plan.outputs.total }}
          report-name: playwright-report-pr-${{ matrix.shard }}
          # Results for refreshing scripts/test-durations; full reports on failure.
          upload-on: results

  # Validate the combined merge-queue commit with the full suite on both
  # supported desktop platforms. This replaces, rather than repeats, PR e2e,
  # and is the first Windows e2e run a change gets. Each platform's suite is
  # split across shards by recorded test time (scripts/test-durations/e2e.json);
  # each shard packages its own app.
  e2e-merge:
    if: github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-6vcpu-macos-latest
            shard: 1/2
            shard-name: blacksmith-6vcpu-macos-latest-1
          - os: blacksmith-6vcpu-macos-latest
            shard: 2/2
            shard-name: blacksmith-6vcpu-macos-latest-2
          - os: blacksmith-8vcpu-windows-2025
            shard: 1/3
            shard-name: blacksmith-8vcpu-windows-2025-1
          - os: blacksmith-8vcpu-windows-2025
            shard: 2/3
            shard-name: blacksmith-8vcpu-windows-2025-2
          - os: blacksmith-8vcpu-windows-2025
            shard: 3/3
            shard-name: blacksmith-8vcpu-windows-2025-3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: e2e-merge-${{ matrix.shard-name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      PLAYWRIGHT_FAIL_ON_FLAKY_TESTS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          save-pnpm-store: "false"
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/run-e2e
        with:
          shard: ${{ matrix.shard }}
          report-name: playwright-report-merge-${{ matrix.shard-name }}
          upload-on: always

  # One HTML report for the sharded macOS leg. Informational only: the gate
  # below depends on the test jobs, never on this merge.
  e2e-merge-report:
    if: always() && github.event_name == 'merge_group'
    needs: e2e-merge
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          save-pnpm-store: "false"
      - run: pnpm install --frozen-lockfile
      - name: Download shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: playwright-report-merge-blacksmith-*
          path: shard-reports
      # Duration-balanced shards pick their spec files themselves rather than
      # through Playwright's `shard` option, so every shard's blob is named
      # report.zip; each copy is renamed after its shard's artifact.
      - name: Merge shard reports per platform
        shell: bash
        run: |
          for platform in blacksmith-6vcpu-macos-latest blacksmith-8vcpu-windows-2025; do
            blobs="$GITHUB_WORKSPACE/blob-reports/$platform"
            mkdir -p "$blobs"
            for shard in shard-reports/playwright-report-merge-"$platform"-*/; do
              for blob in "$shard"blob-report/*.zip; do
                [ -f "$blob" ] && cp "$blob" "$blobs/$(basename "$shard")-$(basename "$blob")"
              done
            done
            ls "$blobs"
            [ -n "$(ls -A "$blobs")" ] || continue
            pnpm --filter @kilo-desktop/e2e exec playwright merge-reports --reporter html "$blobs"
            mv e2e/playwright-report "merged-$platform"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-merge-blacksmith-6vcpu-macos-latest
          path: merged-blacksmith-6vcpu-macos-latest/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-merge-blacksmith-8vcpu-windows-2025
          path: merged-blacksmith-8vcpu-windows-2025/
          if-no-files-found: warn
          retention-days: 30

  # Keep the displayed name while it is the required branch-protection check.
  # The gate covers PR smoke or both merge-queue matrix legs, as appropriate.
  e2e-gate:
    name: e2e-smoke
    if: always()
    needs: [e2e-plan, e2e-pr, e2e-merge]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Verify required E2E jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.e2e-plan.result }}
          PLAN_TOTAL: ${{ needs.e2e-plan.outputs.total }}
          PR_RESULT: ${{ needs.e2e-pr.result }}
          MERGE_RESULT: ${{ needs.e2e-merge.result }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_RESULT" == "success" ]]; then
            exit 0
          fi

          # Nothing the PR changed can reach e2e (planned zero shards).
          if [[ "$EVENT_NAME" == "pull_request" && "$PLAN_RESULT" == "success" && "$PLAN_TOTAL" == "0" && "$PR_RESULT" == "skipped" ]]; then
            echo "No e2e specs selected for this PR."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "merge_group" && "$MERGE_RESULT" == "success" ]]; then
            exit 0
          fi

          echo "E2E gate failed: event=$EVENT_NAME plan=$PLAN_RESULT/$PLAN_TOTAL pr=$PR_RESULT merge=$MERGE_RESULT"
          exit 1

  # One check for branch protection to require, so splitting, renaming or
  # resharding jobs needs no ruleset change. Add every new job to `needs`. A job
  # may be skipped only for the reason this workflow skips it; any other skip
  # fails. `always()`, not `!cancelled()`: a skipped check reports success to
  # branch protection, so a cancelled run must still fail this one.
  # The older per-job gates (test (blacksmith-4vcpu-ubuntu-2404), e2e-smoke)
  # stay until the ruleset requires `Check` in their place.
  check:
    name: Check
    if: always()
    needs: [lint-format, plugin-isolation, typecheck, test-linux, test, e2e-plan, e2e-pr, e2e-merge]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # e2e-merge-report is informational and deliberately not listed.
          echo "$RESULTS" | jq -e --arg event "$EVENT_NAME" '
            def allowed_skip:
              if .key == "e2e-plan" then $event != "pull_request"
              elif .key == "e2e-pr" then $event != "pull_request"
                or (.plan.result == "success" and .plan.outputs.total == "0")
              elif .key == "e2e-merge" then $event != "merge_group"
              else false end;
            .["e2e-plan"] as $plan
            | all(to_entries[] | . + {plan: $plan};
                .value.result == "success"
                or (.value.result == "skipped" and allowed_skip))' > /dev/null
