name: Build pinned notebook UI
description: Build and validate the platform-independent nteract notebook bundle.

runs:
  using: composite
  steps:
    - name: Cache staged notebook UI
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: plugins/notebook/build/notebook
        key: notebook-ui-${{ hashFiles('plugins/notebook/src/packaging/artifacts.ts', 'plugins/notebook/src/packaging/notebook-ui-build.ts') }}

    - uses: ./plugins/notebook/actions/setup-native

    - name: Install wasm-pack
      shell: bash
      run: |
        version="0.15.0"
        dest="${CARGO_HOME:-$HOME/.cargo}/bin"
        mkdir -p "$dest"
        case "$(uname -m)" in
          aarch64|arm64) target="aarch64-unknown-linux-musl" ;;
          *) target="x86_64-unknown-linux-musl" ;;
        esac
        archive="wasm-pack-v${version}-${target}.tar.gz"
        curl -fsSL "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}" \
          | tar -xz --strip-components=1 -C "$dest"
        echo "$dest" >> "$GITHUB_PATH"
        "$dest/wasm-pack" --version

    - name: Build pinned notebook UI
      shell: bash
      env:
        NOTEBOOK_SKIP_NATIVE_BINDING: "1"
      run: pnpm --filter @anaconda-agentic-desktop/plugin-notebook run build-ui
