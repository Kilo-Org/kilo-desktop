name: Build pinned notebook UI
description: Build and validate the platform-independent nteract notebook bundle.

runs:
  using: composite
  steps:
    - uses: ./plugins/notebook/actions/setup-native

    - name: Install wasm-pack
      shell: bash
      run: cargo install wasm-pack --version 0.15.0 --locked

    - name: Build pinned notebook UI
      shell: bash
      run: pnpm --filter @anaconda-agentic-desktop/plugin-notebook run build-ui
