name: Nightly E2E

on:
  schedule:
    # 01:00 UTC daily
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  e2e-full:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, WinLatest-x64-8vCPU-32GB]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: nightly-e2e-${{ matrix.os }}
      cancel-in-progress: false
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
      PLAYWRIGHT_FAIL_ON_FLAKY_TESTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/run-e2e
        with:
          xvfb: ${{ runner.os == 'Linux' }}
          report-name: playwright-report-nightly-${{ matrix.os }}
          upload-on: always
