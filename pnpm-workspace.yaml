packages:
  - apps/*
  - packages/*
  - plugins/*
  - plugins/*/relay-runtime
  - plugins/kilo-ui/opencode-sdk-compat
  - e2e

catalog:
  "@pierre/diffs": 1.3.5
  "@pierre/trees": 1.0.0-beta.6
  "@sentry/electron": ^7.16.0
  "@sentry/react": 10.67.0
  "@sentry/vite-plugin": ^5.0.0
  atomically: ^2.1.1
  electron: ^44.1.1
  electron-log: ^5.4.3
  execa: ^9.6.0
  semver: ^7.8.5
  which: ^7.0.0
  lodash: ^4.17.21
  lucide-react: ^1.27.0
  react-use: ^17.6.1
  type-fest: ^5.8.0
  typescript: ^7.0.2
  vite: ^8.1.5
  vitest: 5.0.0-rc.2
  "@vitest/coverage-v8": 5.0.0-rc.2
  "@tanstack/react-query": ^5.101.4
  react: ^19.0.0
  react-dom: ^19.0.0
  zod: ^4.4.3

savePrefix: ^

nodeLinker: hoisted
injectWorkspacePackages: true
autoInstallPeers: false

overrides:
  "@assistant-ui/react-opencode>@opencode-ai/sdk": "link:plugins/kilo-ui/opencode-sdk-compat"
  # Keep react-opencode on the same core/store as @assistant-ui/react so Vite
  # does not embed a second AssistantContext (breaks composer typing).
  "@assistant-ui/core": "0.3.5"
  "@assistant-ui/store": "0.3.9"
  "@assistant-ui/tap": "0.9.12"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  better-sqlite3: true
  node-pty: true
  "@scarf/scarf": true
  fs-xattr: true
  macos-alias: true
  "@github/keytar": true
  "@anaconda/playwright-utils": false
  unrs-resolver: false
  # Optional native addon pulled in transitively by @vscode/proxy-agent. We
  # never load it (addCertificatesV2 → false), so skip its native build.
  "@vscode/windows-ca-certs": false
  "@sentry/cli": true
  protobufjs: false

minimumReleaseAge: 0

registries:
  default: https://registry.npmjs.org/
  "@anaconda": https://npm.pkg.github.com/

patchedDependencies:
  "@assistant-ui/react-opencode@0.2.17": plugins/kilo-ui/patches/@assistant-ui__react-opencode@0.2.17.patch
