name: Stage pinned notebook UI
description: Download and validate the platform-independent nteract notebook bundle.

runs:
  using: composite
  steps:
    - name: Cache staged notebook UI
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: plugins/notebook/build/notebook
        key: notebook-ui-${{ hashFiles('plugins/notebook/src/packaging/artifacts.ts', 'plugins/notebook/src/packaging/notebook-ui-build.ts') }}

    - name: Stage pinned notebook UI
      shell: bash
      run: pnpm --filter @anaconda-agentic-desktop/plugin-notebook run build-ui
