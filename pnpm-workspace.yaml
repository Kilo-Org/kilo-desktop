packages:
  - apps/*
  - packages/*
  - plugins/*
  - e2e

catalog:
  atomically: ^2.1.1
  electron: 43.2.0
  lodash: ^4.17.21
  typescript: ^7.0.2
  vite: ^8.1.5
  vitest: 5.0.0-beta.7
  zod: ^4.4.3

savePrefix: ^

nodeLinker: hoisted
injectWorkspacePackages: true
autoInstallPeers: false

overrides:
  "@assistant-ui/react-opencode>@opencode-ai/sdk": "link:packages/kilo-opencode-sdk-compat"
  # Keep react-opencode on the same core/store as @assistant-ui/react so Vite
  # does not embed a second AssistantContext (breaks composer typing).
  "@assistant-ui/core": "0.3.5"
  "@assistant-ui/store": "0.3.3"
  "@assistant-ui/tap": "0.9.9"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  better-sqlite3: true
  "@scarf/scarf": true
  fs-xattr: true
  macos-alias: true
  "@github/keytar": true
  "@anaconda/playwright-utils": false
  unrs-resolver: false

minimumReleaseAge: 0

registries:
  default: https://registry.npmjs.org/
  "@anaconda": https://npm.pkg.github.com/

patchedDependencies:
  "@assistant-ui/react-opencode@0.2.17": patches/@assistant-ui__react-opencode@0.2.17.patch
