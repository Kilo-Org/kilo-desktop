name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/turbo-cache
      - run: pnpm check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, WinLatest-x64-8vCPU-32GB, macos-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      # Windows runners contend over native modules and SQLite files.
      group: test-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      # Electron downloads lazily on first import. Install it once before
      # parallel Vitest workers can race while extracting into the same folder.
      - run: pnpm --filter @anaconda-agentic-desktop/desktop exec install-electron
      - uses: ./.github/actions/turbo-cache
      # --with-deps is only needed on Linux (apt system libraries). On Windows
      # it runs a slow, silent Media Foundation DISM install (~3min) that
      # headless tests don't need; on macOS it is a no-op.
      - if: runner.os == 'Linux'
        run: pnpm --filter @anaconda-agentic-desktop/web exec playwright install chromium --with-deps
      - if: runner.os != 'Linux'
        run: pnpm --filter @anaconda-agentic-desktop/web exec playwright install chromium
      - run: pnpm coverage

  e2e-pr:
    if: github.event_name == 'pull_request'
    runs-on: WinLatest-x64-8vCPU-32GB
    timeout-minutes: 60
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/run-e2e
        with:
          script: test:e2e:smoke
          report-name: playwright-report-smoke

  # Validate the combined merge-queue commit with the full suite on both
  # supported desktop platforms. This replaces, rather than repeats, PR smoke.
  e2e-merge:
    if: github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, WinLatest-x64-8vCPU-32GB]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: e2e-merge-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/run-e2e
        with:
          report-name: playwright-report-merge-${{ matrix.os }}

  # Keep the displayed name while it is the required branch-protection check.
  # The gate covers PR smoke or both merge-queue matrix legs, as appropriate.
  e2e-gate:
    name: e2e-smoke
    if: always()
    needs: [e2e-pr, e2e-merge]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required E2E jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_RESULT: ${{ needs.e2e-pr.result }}
          MERGE_RESULT: ${{ needs.e2e-merge.result }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_RESULT" == "success" ]]; then
            exit 0
          fi

          if [[ "$EVENT_NAME" == "merge_group" && "$MERGE_RESULT" == "success" ]]; then
            exit 0
          fi

          echo "E2E gate failed: event=$EVENT_NAME pr=$PR_RESULT merge=$MERGE_RESULT"
          exit 1
