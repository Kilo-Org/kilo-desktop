name: Warm caches

# CI runs only on pull requests and the merge queue, and a cache saved there is
# visible to that branch alone, so before this every PR started cold: all
# ~1,250 packages from the registry, plus the notebook runtime and Kilo CLI
# downloads, on every job. Caches saved on main are visible to every PR and
# merge-queue run, so this saves them after each merge, on each runner type
# CI uses (Linux 2/4 vCPU share a cache key).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-caches
  cancel-in-progress: true

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            native: false
          # PR e2e and the Windows test leg.
          - os: blacksmith-8vcpu-windows-2025
            native: true
          # The macOS test leg and merge-queue e2e.
          - os: blacksmith-6vcpu-macos-latest
            native: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      # The same caches run-e2e restores; they save when this job ends.
      - if: matrix.native
        uses: ./plugins/notebook/actions/setup-native
      - if: matrix.native
        uses: ./plugins/core/actions/setup-cli
      - name: Stage notebook runtime and Kilo CLI
        if: matrix.native
        shell: bash
        run: |
          pnpm --filter @kilo-desktop/plugin-core run prepare-assets
          pnpm --filter @kilo-desktop/plugin-notebook run prepare-assets
