name: Nightly E2E

on:
  schedule:
    # 01:00 UTC daily
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  e2e-full:
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            blacksmith-6vcpu-macos-latest,
            blacksmith-4vcpu-ubuntu-2404,
            blacksmith-8vcpu-windows-2025,
          ]
        # The Kilo server lines (docs/adr/003-kilo-server-line.md).
        server-line: [v1, v2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: nightly-e2e-${{ matrix.os }}-${{ matrix.server-line }}
      cancel-in-progress: false
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      PLAYWRIGHT_FAIL_ON_FLAKY_TESTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/run-e2e
        with:
          xvfb: ${{ runner.os == 'Linux' }}
          server-line: ${{ matrix.server-line }}
          report-name: playwright-report-nightly${{ matrix.server-line == 'v2' && '-v2' || '' }}-${{ matrix.os }}
          upload-on: always
