packages:
  - apps/*
  - packages/*

catalog:
  typescript: ^7.0.2
  vite: ^8.1.5
  vitest: 5.0.0-beta.7
  zod: ^4.4.3

savePrefix: ^

nodeLinker: hoisted
injectWorkspacePackages: true
autoInstallPeers: false

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  better-sqlite3: true
  "@scarf/scarf": true
  fs-xattr: true
  macos-alias: true

minimumReleaseAge: 0

registries:
  default: https://registry.npmjs.org/
  "@anaconda": https://npm.pkg.github.com/
