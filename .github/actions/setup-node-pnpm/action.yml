name: Setup Node and pnpm
description: >
  Install pnpm and Node using the repository .nvmrc and pnpm cache, with
  GitHub Packages auth for the @anaconda scope. Callers must set
  NODE_AUTH_TOKEN (typically secrets.ANACONDA_PACKAGES_TOKEN).

inputs:
  pnpm-cache:
    description: >
      Restore the pnpm store from the Actions cache. Release builds pass
      "false" so they install every package fresh from the registry.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.pnpm-cache == 'true' && 'pnpm' || '' }}
        registry-url: https://npm.pkg.github.com
        scope: "@anaconda"
