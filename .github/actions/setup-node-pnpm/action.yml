name: Setup Node and pnpm
description: >
  Install pnpm and Node using the repository .nvmrc and pnpm cache, with
  GitHub Packages auth for the @anaconda scope. Callers must set
  NODE_AUTH_TOKEN (typically secrets.GH_DESIGN_SYSTEM_TOKEN).

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Install Node
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        registry-url: https://npm.pkg.github.com
        scope: "@anaconda"
