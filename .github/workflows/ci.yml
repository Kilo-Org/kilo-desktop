name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep real-git fixtures independent of the runner's global configuration.
  GIT_CONFIG_COUNT: "6"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: core.filemode
  GIT_CONFIG_VALUE_1: "false"
  GIT_CONFIG_KEY_2: core.longpaths
  GIT_CONFIG_VALUE_2: "true"
  GIT_CONFIG_KEY_3: commit.gpgsign
  GIT_CONFIG_VALUE_3: "false"
  GIT_CONFIG_KEY_4: tag.gpgsign
  GIT_CONFIG_VALUE_4: "false"
  GIT_CONFIG_KEY_5: init.defaultBranch
  GIT_CONFIG_VALUE_5: main

jobs:
  lint-format:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/turbo-cache
      # --affected: on depth-1 checkouts turbo can't resolve the merge base
      # and safely falls back to running every package.
      - run: pnpm exec turbo run check --affected

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, WinLatest-x64-8vCPU-32GB, macos-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      # Windows runners contend over native modules and SQLite files.
      group: test-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      GIT_CONFIG_NOSYSTEM: "true"
    steps:
      # Job-level env cannot use the runner context, so pin GIT_CONFIG_GLOBAL
      # here before checkout. An empty writable file (not /dev/null) lets
      # `git config --global` writes such as checkout's safe.directory succeed
      # without touching the runner's real gitconfig.
      - name: Isolate git config
        shell: bash
        run: |
          : > "$RUNNER_TEMP/kilo-test-gitconfig"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/kilo-test-gitconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/turbo-cache
      # Full coverage, including browser projects, runs once. The platform
      # matrix legs below retain checks for real Git and filesystem behavior.
      - if: runner.os == 'Linux'
        uses: ./.github/actions/install-test-runtime
        with:
          runtime: electron
          package-name: "@kilo-desktop/desktop"
      - if: runner.os == 'Linux'
        uses: ./.github/actions/install-test-runtime
        with:
          runtime: playwright
          package-name: "@kilo-desktop/web"
          with-deps: "true"
      - if: runner.os == 'Linux'
        run: pnpm exec turbo run coverage --affected --concurrency=2
      # Turbo-managed platform tests: cached, and the three packages run
      # concurrently instead of one pnpm --filter invocation at a time.
      - name: Run platform compatibility tests
        if: runner.os != 'Linux'
        shell: bash
        run: >-
          pnpm exec turbo run test:platform
          --filter=@kilo-desktop/git-client
          --filter=@kilo-desktop/plugin-kilo-server
          --filter=@kilo-desktop/plugin-notebook

  e2e-pr:
    if: github.event_name == 'pull_request'
    runs-on: WinLatest-x64-8vCPU-32GB
    timeout-minutes: 60
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      PLAYWRIGHT_FAIL_ON_FLAKY_TESTS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      # @smoke plus the full specs of every area the PR touches, so a
      # plugin's non-smoke specs do not first run (and fail) in the merge queue.
      - name: Select e2e specs for changed areas
        id: e2e-selection
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          grep="$(git diff --name-only "$BASE_SHA" HEAD | node e2e/scripts/select-pr-e2e.ts)"
          echo "E2E selection: $grep"
          echo "grep=$grep" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/run-e2e
        with:
          script: test:e2e
          grep: ${{ steps.e2e-selection.outputs.grep }}
          report-name: playwright-report-smoke
          upload-on: always

  # Validate the combined merge-queue commit with the full suite on both
  # supported desktop platforms. This replaces, rather than repeats, PR smoke.
  # macOS is the slowest leg (smaller runners, longer packaging), so its suite
  # is split across two shards; each shard still packages its own app.
  e2e-merge:
    if: github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            shard: 1/2
            shard-name: macos-latest-1
          - os: macos-latest
            shard: 2/2
            shard-name: macos-latest-2
          - os: WinLatest-x64-8vCPU-32GB
            shard: ""
            shard-name: WinLatest-x64-8vCPU-32GB
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: e2e-merge-${{ matrix.shard-name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      PLAYWRIGHT_FAIL_ON_FLAKY_TESTS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/run-e2e
        with:
          shard: ${{ matrix.shard }}
          report-name: playwright-report-merge-${{ matrix.shard-name }}
          upload-on: always

  # One HTML report for the sharded macOS leg. Informational only: the gate
  # below depends on the test jobs, never on this merge.
  e2e-merge-report:
    if: always() && github.event_name == 'merge_group'
    needs: e2e-merge
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
      ANACONDA_NPM_TOKEN: ${{ secrets.ANACONDA_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download macOS shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: playwright-report-merge-macos-latest-*
          path: shard-reports
      # Each shard's blob reporter writes report-<shard>.zip, so the files
      # can share one directory without renaming.
      - name: Merge macOS shard reports
        shell: bash
        run: |
          mkdir -p all-blob-reports
          find shard-reports -path '*/blob-report/*.zip' -exec cp {} all-blob-reports/ \;
          ls all-blob-reports
          pnpm --filter @kilo-desktop/e2e exec playwright merge-reports --reporter html "$GITHUB_WORKSPACE/all-blob-reports"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-merge-macos-latest
          path: e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 30

  # Keep the displayed name while it is the required branch-protection check.
  # The gate covers PR smoke or both merge-queue matrix legs, as appropriate.
  e2e-gate:
    name: e2e-smoke
    if: always()
    needs: [e2e-pr, e2e-merge]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required E2E jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_RESULT: ${{ needs.e2e-pr.result }}
          MERGE_RESULT: ${{ needs.e2e-merge.result }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_RESULT" == "success" ]]; then
            exit 0
          fi

          if [[ "$EVENT_NAME" == "merge_group" && "$MERGE_RESULT" == "success" ]]; then
            exit 0
          fi

          echo "E2E gate failed: event=$EVENT_NAME pr=$PR_RESULT merge=$MERGE_RESULT"
          exit 1
