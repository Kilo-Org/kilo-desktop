name: Run Electron e2e
description: >
  Package the desktop app for Playwright (inspect fuse enabled) and run the
  e2e suite. Callers must set NODE_AUTH_TOKEN / ANACONDA_NPM_TOKEN.

inputs:
  script:
    description: e2e package script to run (test:e2e or test:e2e:smoke).
    required: false
    default: test:e2e
  grep:
    description: >
      Optional Playwright grep pattern (see e2e/scripts/select-pr-e2e.ts),
      passed as E2E_GREP. Use with the unfiltered test:e2e script.
    required: false
    default: ""
  shard:
    description: >
      Optional shard as "current/total" (e.g. 1/2), passed as E2E_SHARD. The
      config splits spec files by recorded duration (scripts/test-durations/e2e.json).
    required: false
    default: ""
  packaged-app:
    description: >
      Name of an artifact holding a packaged app (apps/desktop/out) from an
      earlier job. When set, the app is downloaded instead of packaged here.
    required: false
    default: ""
  workers:
    description: >
      Parallel Playwright workers (one packaged app each), passed as
      E2E_WORKERS. Empty: one per 2 vCPUs (minimum 2), so bigger runners run
      more apps at once before a job needs more shards.
    required: false
    default: ""
  xvfb:
    description: Wrap the test command in xvfb-run (Linux CI).
    required: false
    default: "false"
  report-name:
    description: Artifact name for the Playwright HTML report.
    required: false
    default: playwright-report
  upload-on:
    description: >
      When to upload the report artifact: failure, always, or results (the
      full report on failure, only the JUnit and JSON results on success).
    required: false
    default: failure

runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-test-runtime
      with:
        runtime: electron
        package-name: "@kilo-desktop/desktop"

    # Specs drive the packaged app through `_electron.launch` and never open a
    # Playwright browser, so no Chromium download. Linux still needs the
    # system libraries Electron loads under xvfb, which the same installer
    # provides. (On Windows, --with-deps would run a slow DISM install.)
    - if: runner.os == 'Linux'
      uses: ./.github/actions/install-test-runtime
      with:
        runtime: playwright-deps
        package-name: "@kilo-desktop/e2e"

    # Inputs to packaging only; the harness reads the CLI from the packaged app.
    - if: inputs.packaged-app == ''
      uses: ./plugins/notebook/actions/setup-native

    - if: inputs.packaged-app == ''
      uses: ./plugins/core/actions/setup-cli

    - name: Package desktop for e2e
      if: inputs.packaged-app == ''
      shell: bash
      run: pnpm --filter @kilo-desktop/desktop run package:e2e

    - name: Download the packaged desktop app
      if: inputs.packaged-app != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.packaged-app }}
        path: ${{ runner.temp }}/packaged-app

    # A tarball (see e2e-package in ci.yml) keeps executable bits and symlinks,
    # which artifact uploads drop.
    - name: Unpack the packaged desktop app
      if: inputs.packaged-app != ''
      shell: bash
      run: |
        mkdir -p apps/desktop
        tar -xf "$RUNNER_TEMP/packaged-app/desktop-out.tar" -C apps/desktop

    - name: Run e2e
      shell: bash
      env:
        SKIP_BUILD: "true"
        E2E_GREP: ${{ inputs.grep }}
        E2E_SHARD: ${{ inputs.shard }}
        WORKERS: ${{ inputs.workers }}
      run: |
        if [ -z "$WORKERS" ]; then
          cpus="$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          WORKERS=$(( cpus / 2 > 2 ? cpus / 2 : 2 ))
        fi
        export E2E_WORKERS="$WORKERS"
        echo "Playwright workers: $E2E_WORKERS"
        # A grep-narrowed PR run can leave a shard with no matching tests.
        args=()
        if [ -n "$E2E_SHARD" ]; then args+=(--pass-with-no-tests); fi
        if [ "${{ inputs.xvfb }}" = "true" ]; then
          xvfb-run --auto-servernum pnpm --filter @kilo-desktop/e2e run ${{ inputs.script }} "${args[@]}"
        else
          pnpm --filter @kilo-desktop/e2e run ${{ inputs.script }} "${args[@]}"
        fi

    - name: Report flaky tests
      if: ${{ !cancelled() }}
      shell: bash
      run: node e2e/scripts/report-flaky.ts test-results/results.json

    - name: Upload Playwright results
      if: ${{ inputs.upload-on == 'always' || failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-name }}
        path: |
          playwright-report/
          blob-report/
          test-results/
        if-no-files-found: warn
        retention-days: 30

    # The small files scripts/record-test-durations.mjs needs, without the
    # HTML report, traces and blob that make a full upload slow.
    - name: Upload Playwright results summary
      if: ${{ inputs.upload-on == 'results' && success() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-name }}
        path: |
          test-results/junit.xml
          test-results/results.json
        if-no-files-found: warn
        retention-days: 30
