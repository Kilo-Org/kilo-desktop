name: Cache Kilo CLI
description: >
  Restore the platform-specific Kilo CLI staged by prepare-assets. The cache
  key tracks cli-distribution/artifacts.ts, which pins KILO_CLI_VERSION and
  the integrity hashes.

runs:
  using: composite
  steps:
    - name: Cache Kilo CLI
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: plugins/kilo-server/resources/kilo
        key: kilo-cli-${{ runner.os }}-${{ hashFiles('plugins/kilo-server/src/main/cli-distribution/artifacts.ts') }}
