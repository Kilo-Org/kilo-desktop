name: Install test runtime
description: Install Electron or Playwright with bounded retries for transient download failures.

# No Playwright system dependencies (`install-deps`): the runner images already
# carry every library Chromium and Electron load, xvfb included. It only ever
# added CJK/Cyrillic fonts no spec renders, plus upgrades of installed libraries,
# for ~15-22 s of apt downloads per job.

inputs:
  runtime:
    description: "Runtime to install: electron, or playwright (Chromium browser)."
    required: true
  package-name:
    description: Workspace package that provides the installer.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve the Playwright version
      if: inputs.runtime == 'playwright'
      id: playwright
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
      run: echo "version=$(pnpm --filter "$PACKAGE_NAME" exec playwright --version | sed -E 's/^Version //')" >> "$GITHUB_OUTPUT"

    # The browsers come from cdn.playwright.dev; a Playwright version pins their
    # builds, so the cache never goes stale. Saved on main by warm-caches.yml.
    - name: Cache Playwright browsers
      if: inputs.runtime == 'playwright'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'Linux' && '~/.cache/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/AppData/Local/ms-playwright' }}
        key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

    # On a cache hit `playwright install` finds the browsers and downloads nothing.
    # A miss downloads with Playwright's own stall timeout
    # (PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT, 30 s) inside these retries.
    - name: Install ${{ inputs.runtime }}
      shell: bash
      env:
        RUNTIME: ${{ inputs.runtime }}
        PACKAGE_NAME: ${{ inputs.package-name }}
      run: |
        case "$RUNTIME" in
          electron)
            command=(pnpm --filter "$PACKAGE_NAME" exec install-electron)
            ;;
          playwright)
            command=(pnpm --filter "$PACKAGE_NAME" exec playwright install chromium)
            ;;
          *)
            echo "Unsupported test runtime: $RUNTIME" >&2
            exit 2
            ;;
        esac

        for attempt in 1 2 3; do
          if "${command[@]}"; then
            exit 0
          fi
          if [[ "$attempt" == "3" ]]; then
            echo "Failed to install $RUNTIME after 3 attempts." >&2
            exit 1
          fi
          delay=$((attempt * 10))
          echo "Install attempt $attempt failed; retrying in ${delay}s."
          sleep "$delay"
        done
