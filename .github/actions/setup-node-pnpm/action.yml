name: Setup Node and pnpm
description: >
  Install pnpm and Node using the repository .nvmrc and pnpm cache, with
  GitHub Packages auth for the @anaconda scope. Callers must set
  NODE_AUTH_TOKEN (typically secrets.GH_DESIGN_SYSTEM_TOKEN).

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        registry-url: https://npm.pkg.github.com
        scope: "@anaconda"
