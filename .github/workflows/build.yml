# Build and optionally publish Electron Forge artifacts.

name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        required: true
        default: mac
        type: choice
        options:
          - mac
          - windows
          - linux
          - all
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'canary' }}
  UPDATE_PUBLISH_URL: ${{ vars.UPDATE_PUBLISH_URL }}
  UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  build-mac:
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'mac' ||
      inputs.platform == 'all'
    runs-on: macos-latest
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make DMG and ZIP
        if: github.event_name != 'push'
        run: pnpm run make
      - name: Publish DMG and ZIP
        if: github.event_name == 'push'
        run: pnpm run publish
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            apps/desktop/out/make/**/*.dmg
            apps/desktop/out/make/**/*.zip
            apps/desktop/out/make/**/RELEASES.json
          if-no-files-found: error

  build-windows:
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'windows' ||
      inputs.platform == 'all'
    runs-on: windows-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Prepare signing certificate
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $certificate = '${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}'
          if ($certificate) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($certificate))
            "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - run: pnpm install --frozen-lockfile
      - name: Make Squirrel installer
        if: github.event_name != 'push'
        run: pnpm run make
      - name: Publish Squirrel installer
        if: github.event_name == 'push'
        run: pnpm run publish
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            apps/desktop/out/make/**/*.exe
            apps/desktop/out/make/**/*.nupkg
            apps/desktop/out/make/**/RELEASES
          if-no-files-found: error

  build-linux:
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'linux' ||
      inputs.platform == 'all'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install maker prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm
      - run: pnpm install --frozen-lockfile
      - name: Make DEB and RPM
        if: github.event_name != 'push'
        run: pnpm run make
      - name: Publish DEB and RPM
        if: github.event_name == 'push'
        run: pnpm run publish
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            apps/desktop/out/make/**/*.deb
            apps/desktop/out/make/**/*.rpm
          if-no-files-found: error
