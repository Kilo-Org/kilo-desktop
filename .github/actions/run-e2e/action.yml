name: Run Electron e2e
description: >
  Package the desktop app for Playwright (inspect fuse enabled) and run the
  e2e suite. Callers must set NODE_AUTH_TOKEN / ANACONDA_NPM_TOKEN.

inputs:
  script:
    description: e2e package script to run (test:e2e or test:e2e:smoke).
    required: false
    default: test:e2e
  xvfb:
    description: Wrap the test command in xvfb-run (Linux CI).
    required: false
    default: "false"
  report-name:
    description: Artifact name for the Playwright HTML report.
    required: false
    default: playwright-report
  upload-on:
    description: When to upload the report artifact (failure or always).
    required: false
    default: failure

runs:
  using: composite
  steps:
    - name: Install Linux native build prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes build-essential libsecret-1-dev pkg-config

    # --with-deps is only needed on Linux. On Windows it runs a slow, silent
    # Media Foundation DISM install (~3min) that the e2e tests don't need.
    - name: Install Playwright browsers (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: pnpm --filter @anaconda-agentic-desktop/e2e exec playwright install chromium --with-deps

    - name: Install Playwright browsers (macOS/Windows)
      if: runner.os != 'Linux'
      shell: bash
      run: pnpm --filter @anaconda-agentic-desktop/e2e exec playwright install chromium

    - uses: ./plugins/notebook/actions/setup-native

    - uses: ./plugins/kilo-server/actions/setup-cli

    - uses: ./.github/actions/cache-electron-rebuild

    - name: Package desktop for e2e
      shell: bash
      run: pnpm --filter @anaconda-agentic-desktop/desktop run package:e2e

    - name: Run e2e
      shell: bash
      env:
        SKIP_BUILD: "true"
      run: |
        if [ "${{ inputs.xvfb }}" = "true" ]; then
          xvfb-run --auto-servernum pnpm --filter @anaconda-agentic-desktop/e2e run ${{ inputs.script }}
        else
          pnpm --filter @anaconda-agentic-desktop/e2e run ${{ inputs.script }}
        fi

    - name: Upload Playwright report
      if: ${{ inputs.upload-on == 'always' || failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.report-name }}
        path: |
          playwright-report/
          test-results/
        retention-days: 30
