# Build platform artifacts (DMG, NSIS, AppImage).
#
# Trigger manually via workflow_dispatch, or on tags for release builds.
# Unsigned by default — code signing and notarization require secrets
# (CSC_NAME, APPLE_API_KEY_ID, etc.) configured in the repo settings.
#
# Ported from labs-anaconda-agent-studio build patterns.

name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        default: "mac"
        type: choice
        options:
          - mac
          - windows
          - linux
          - all
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skip code signing by default; CI sets these from repo secrets for release builds.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build-mac:
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'mac' ||
      inputs.platform == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Package DMG (unsigned)
        working-directory: app
        run: >-
          npx electron-builder
          --config ../electron-builder.config.js
          --mac dmg zip
          --publish=never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-windows:
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'windows' ||
      inputs.platform == 'all'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Package NSIS (unsigned)
        working-directory: app
        run: >-
          npx electron-builder
          --config ../electron-builder.config.js
          --win
          --publish=never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'linux' ||
      inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Package AppImage + pacman (unsigned)
        working-directory: app
        run: >-
          npx electron-builder
          --config ../electron-builder.config.js
          --linux
          --publish=never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            release/*.AppImage
            release/*.pacman
          if-no-files-found: error
