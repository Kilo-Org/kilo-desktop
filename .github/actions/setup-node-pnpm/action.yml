name: Setup Node and pnpm
description: >
  Install pnpm and Node using the repository .nvmrc and pnpm cache, with
  GitHub Packages auth for the @anaconda scope. Callers must set
  NODE_AUTH_TOKEN (typically secrets.GH_DESIGN_SYSTEM_TOKEN).

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        registry-url: https://npm.pkg.github.com
        scope: "@anaconda"
