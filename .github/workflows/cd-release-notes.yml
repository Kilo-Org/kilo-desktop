# AI-written release notes for agentic-desktop, published to Confluence (space QA).
# Calls the shared workflow in anaconda/internal-actions; see its
# .github/actions/generate-release-notes/INTEGRATION.md.
#
# Inert until turned on. Manual runs only for now. Publishing needs the repo on the
# Vault releasenotes list; until then a dry run is all that works.
# Notes go to Confluence only, so this never touches a GitHub Release body.
name: "[CD] Release Notes"

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: "Range start, e.g. the previous version tag"
        type: string
      to_tag:
        description: "Range end, e.g. the version just shipped"
        type: string
      since:
        description: "Or a date window start, YYYY-MM-DD (for unversioned changes)"
        type: string
      until:
        description: "Window end, YYYY-MM-DD (defaults to now)"
        type: string
      dry_run:
        description: "Print without publishing"
        type: boolean
        default: true

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  release-notes:
    uses: anaconda/internal-actions/.github/workflows/release-notes.yml@v2.21.1
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      # Must stay unique across every repo publishing into space QA: pages are
      # found by title and space, so a shared label would overwrite.
      component: agentic-desktop
      from_tag: ${{ inputs.from_tag }}
      to_tag: ${{ inputs.to_tag }}
      since: ${{ inputs.since }}
      until: ${{ inputs.until }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
