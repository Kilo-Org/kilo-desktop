<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Kilo Desktop — plugin dependency graph (3D)</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #14161b;
				color: #d8dce4;
				font:
					14px/1.4 system-ui,
					sans-serif;
			}
			#c {
				width: 100%;
				height: 100vh;
				display: block;
			}
			header {
				position: absolute;
				top: 16px;
				left: 20px;
				pointer-events: none;
			}
			header h1 {
				margin: 0 0 4px;
				font-size: 18px;
				font-weight: 600;
			}
			header p {
				margin: 0;
				color: #8b93a3;
				max-width: 46ch;
			}
			.controls {
				position: absolute;
				bottom: 16px;
				left: 20px;
				display: flex;
				gap: 8px;
			}
			.controls button {
				background: #232733;
				color: #d8dce4;
				border: 1px solid #343a48;
				border-radius: 6px;
				padding: 6px 12px;
				cursor: pointer;
			}
			.controls button:hover {
				background: #2d3240;
			}
			.controls button,
			.controls select {
				font: inherit;
			}
			.controls select {
				background: #232733;
				color: #d8dce4;
				border: 1px solid #343a48;
				border-radius: 6px;
				padding: 6px 8px;
			}
			.controls .sep {
				width: 1px;
				background: #343a48;
				margin: 0 4px;
			}
			#info {
				position: absolute;
				top: 16px;
				right: 20px;
				width: 260px;
				background: #1c1f27e6;
				border: 1px solid #2c313d;
				border-radius: 8px;
				padding: 12px 14px;
				display: none;
			}
			#info h2 {
				margin: 0 0 6px;
				font-size: 15px;
			}
			#info dl {
				margin: 0;
				display: grid;
				grid-template-columns: auto 1fr;
				gap: 2px 10px;
			}
			#info dt {
				color: #8b93a3;
			}
			#info dd {
				margin: 0;
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"phoria2": "https://cdn.jsdelivr.net/npm/phoria2@1.2.0/dist/phoria2.js",
					"phoria2/charts": "https://cdn.jsdelivr.net/npm/phoria2@1.2.0/dist/charts.js"
				}
			}
		</script>
	</head>
	<body>
		<canvas id="c"></canvas>
		<header>
			<h1>Plugin dependency graph</h1>
			<p>Click a plugin to see everything it requires.</p>
		</header>
		<div id="info"></div>
		<div class="controls">
			<select id="focus" aria-label="Show requirements of">
				<option value="">All plugins</option>
			</select>
			<span class="sep"></span>
			<button id="reset">Reset view</button>
			<button id="side">Side view</button>
			<button id="top">Top view</button>
			<button id="spin">Toggle spin</button>
		</div>
		<script type="module">
			import { View, InstancedMesh, Lines, cylinder } from "phoria2";
			import { chart } from "phoria2/charts";

			// "core" is the Kilo server plugin (kilo.core) and requires nothing, so it is the base every
			// other plugin builds on.
			const TIER = {
				kernel: "kernel",
				core: "base",
				shell: "foundation",
				"work-sessions": "foundation",
			};

			// Plugin -> plugin edges; points = number of distinct domains / extension points required.
			// 'kernel' collects explicit kernel/* requires - every plugin runs on the kernel.
			// Generated from plugins/*/plugin.json - do not edit between the markers.
			// links:start (pnpm docs:plugin-graph)
			const links = [
				["anaconda", "local-inference", 1],
				["anaconda", "shell", 1],
				["browser", "chat", 1],
				["browser", "core", 1],
				["browser", "work-sessions", 6],
				["chat", "core", 6],
				["chat", "shell", 3],
				["chat", "work-sessions", 9],
				["developer", "shell", 2],
				["environments", "anaconda", 1],
				["environments", "chat", 2],
				["environments", "core", 3],
				["environments", "local-inference", 1],
				["environments", "shell", 3],
				["files", "chat", 2],
				["files", "core", 1],
				["files", "shell", 1],
				["files", "work-sessions", 8],
				["git", "chat", 2],
				["git", "core", 4],
				["git", "kernel", 3],
				["git", "shell", 2],
				["git", "work-sessions", 12],
				["local-inference", "chat", 1],
				["local-inference", "core", 2],
				["local-inference", "shell", 4],
				["marketplace", "chat", 1],
				["marketplace", "core", 2],
				["marketplace", "shell", 1],
				["marketplace", "work-sessions", 1],
				["notebook", "chat", 1],
				["notebook", "core", 3],
				["notebook", "shell", 2],
				["notebook", "work-sessions", 6],
				["shell", "core", 6],
				["terminal", "core", 1],
				["terminal", "shell", 1],
				["terminal", "work-sessions", 5],
				["work-sessions", "core", 2],
				["work-sessions", "kernel", 3],
				["work-sessions", "shell", 10],
				["workspace-board", "shell", 1],
				["workspace-board", "work-sessions", 7],
			]
				// links:end
				.map(([source, target, points]) => ({ source, target, points }));

			const ids = [...new Set(links.flatMap((l) => [l.source, l.target]))].sort();
			const nodes = ids.map((id) => {
				const uses = links.filter((l) => l.source === id).map((l) => l.target);
				const usedBy = links.filter((l) => l.target === id).map((l) => l.source);
				return {
					id,
					tier: TIER[id] ?? "feature",
					dependents: usedBy.length,
					uses: uses.length,
					usesList: uses,
					usedByList: usedBy,
				};
			});

			const view = new View({ canvas: "#c", orbit: true, background: "#14161b" });

			const graph = view.scene.add(
				chart({
					mark: "network",
					data: { nodes, links },
					color: {
						field: "tier",
						title: "Tier",
						scale: {
							domain: ["feature", "foundation", "base", "kernel"],
							range: ["#4cc9f0", "#f8961e", "#90be6d", "#e9e9f0"],
						},
					},
					size: "dependents",
					label: "id",
					link: {
						width: "points",
						color: "#5c6577",
						tooltip: [
							{ field: "source", title: "Plugin" },
							{ field: "target", title: "Uses" },
							{ field: "points", title: "Points / domains" },
						],
					},
					layout: { tiers: "tier", order: ["kernel", "base", "foundation", "feature"] },
					highlight: "neighbours",
					tooltip: [
						"id",
						"tier",
						{ field: "dependents", title: "Used by" },
						{ field: "uses", title: "Uses" },
					],
					theme: "dark",
					legend: { position: "bottom-right" },
					box: [12, 9, 12],
				}),
			);

			view.frame(graph, { direction: [0.6, 0.35, 1] });

			// Arrowheads: the network mark has no directed links, so a cone per link sits on the surface of
			// the plugin being used, pointing at it. They follow the chart's own link geometry, which the
			// chart rebuilds on every layout and transition frame - so rebuild the cones whenever it changes.
			const ARROW_LENGTH = 0.32,
				ARROW_RADIUS = 0.11;
			const arrows = new InstancedMesh({
				geometry: cylinder({
					radius: ARROW_RADIUS,
					radiusTop: 0,
					height: ARROW_LENGTH,
					segments: 12,
				}),
				material: { color: "#9aa3b5", roughness: 0.6 },
				count: links.length,
				pickable: false,
			});
			let arrowsFor = [];

			function chartParts() {
				const marks = graph.marks;
				return {
					linkLines: marks.filter((n) => n instanceof Lines && n.visible && n.data?.length),
					nodesMesh: marks.find((n) => n instanceof InstancedMesh),
				};
			}

			function updateArrows() {
				const { linkLines, nodesMesh } = chartParts();
				if (!nodesMesh) return;
				const watched = [nodesMesh, ...linkLines.map((l) => l.geometry)];
				if (watched.length === arrowsFor.length && watched.every((w, i) => w === arrowsFor[i]))
					return;
				arrowsFor = watched;
				if (!arrows.parent) nodesMesh.parent.add(arrows);

				const indexById = new Map(nodesMesh.data.map((row, i) => [row.id, i]));
				const radiusOf = (id) => {
					const m = nodesMesh.instanceMatrices,
						o = indexById.get(id) * 16;
					return Math.hypot(m[o], m[o + 1], m[o + 2]);
				};

				let i = 0;
				for (const line of linkLines) {
					const p = line.geometry.positions;
					line.data.forEach((link, s) => {
						const o = s * 6;
						const dx = p[o + 3] - p[o],
							dy = p[o + 4] - p[o + 1],
							dz = p[o + 5] - p[o + 2];
						const len = Math.hypot(dx, dy, dz);
						if (len < 1e-6) return;
						const d = [dx / len, dy / len, dz / len];
						const back = radiusOf(link.target) + ARROW_LENGTH / 2;
						// rotate the cone's +Y axis onto the link direction
						const q = d[1] < -0.9999 ? [1, 0, 0, 0] : normalise([d[2], 0, -d[0], 1 + d[1]]);
						arrows.setInstance(i++, {
							position: [p[o + 3] - d[0] * back, p[o + 4] - d[1] * back, p[o + 5] - d[2] * back],
							quaternion: q,
							scale: 1,
						});
					});
				}
				for (; i < links.length; i++) arrows.setInstance(i, { position: [0, 0, 0], scale: 0 });
			}

			// arrows still placed for the previous layout would pull view.frame() off the new one; they are
			// rebuilt on the next frame
			function hideArrows() {
				for (let i = 0; i < links.length; i++)
					arrows.setInstance(i, { position: [0, 0, 0], scale: 0 });
				arrowsFor = [];
			}

			function normalise(v) {
				const l = Math.hypot(...v);
				return v.map((x) => x / l);
			}

			graph.onUpdate(updateArrows);
			updateArrows();

			const $ = (sel) => document.querySelector(sel);
			const info = $("#info"),
				focusSelect = $("#focus");
			const nodeById = new Map(nodes.map((n) => [n.id, n]));
			const label = (id) => (id === "kernel" ? "kernel/*" : `kilo.${id}`);

			for (const id of ids) focusSelect.add(new Option(label(id), id));

			let focused = null;

			function requirementsOf(id) {
				const seen = new Set([id]);
				const queue = [id];
				while (queue.length) {
					for (const next of nodeById.get(queue.shift()).usesList) {
						if (!seen.has(next)) {
							seen.add(next);
							queue.push(next);
						}
					}
				}
				return seen;
			}

			function showNode(d, shown) {
				const required = shown ? [...shown].filter((id) => id !== d.id).sort() : null;
				info.innerHTML = `<h2>${label(d.id)}</h2><dl>
    <dt>Tier</dt><dd>${d.tier}</dd>
    <dt>Uses (${d.uses})</dt><dd>${d.usesList.join(", ") || "—"}</dd>
    ${required ? `<dt>All reqs (${required.length})</dt><dd>${required.join(", ") || "—"}</dd>` : ""}
    <dt>Used by (${d.dependents})</dt><dd>${d.usedByList.join(", ") || "—"}</dd></dl>`;
				info.style.display = "block";
			}

			function applyFocus() {
				focusSelect.value = focused ?? "";
				if (!focused) {
					graph.update({ nodes, links });
					info.style.display = "none";
				} else {
					const shown = requirementsOf(focused);
					const shownLinks = links.filter((l) => shown.has(l.source) && shown.has(l.target));
					graph.update({ nodes: nodes.filter((n) => shown.has(n.id)), links: shownLinks });
					showNode(nodeById.get(focused), shown);
				}
				frameWhenSettled();
			}

			// view.frame() fits where the nodes are now, so wait out the chart's 0.5s transition - otherwise
			// switching mid-animation fits a layout that is still moving
			let frameTimer;
			function frameWhenSettled() {
				clearTimeout(frameTimer);
				frameTimer = setTimeout(
					() => {
						hideArrows();
						view.frame(graph, { direction: [0.6, 0.35, 1], duration: 0.5 });
					},
					view.reducedMotion ? 0 : 550,
				);
			}

			function focus(id) {
				focused = id || null;
				applyFocus();
			}

			view.on("click", (hit) => {
				const d = hit?.datum;
				// empty space; phoria2 never reports a drag (orbit/pan) as a click
				if (!d) {
					if (focused) focus(null);
					return;
				}
				if ("source" in d) {
					info.innerHTML = `<h2>${d.source} → ${d.target}</h2><dl><dt>Points</dt><dd>${d.points}</dd></dl>`;
					info.style.display = "block";
				} else {
					focus(d.id);
				}
			});

			focusSelect.onchange = () => focus(focusSelect.value);
			addEventListener("keydown", (e) => {
				if (e.key === "Escape" && focused) focus(null);
			});

			document.querySelector("#reset").onclick = () =>
				view.frame(graph, { direction: [0.6, 0.35, 1], duration: 0.6 });
			document.querySelector("#side").onclick = () =>
				view.frame(graph, { direction: "front", duration: 0.6 });
			document.querySelector("#top").onclick = () =>
				view.frame(graph, { direction: "top", duration: 0.6 });
			document.querySelector("#spin").onclick = () => {
				view.controls.autoRotate = view.controls.autoRotate ? 0 : 0.12;
			};
		</script>
	</body>
</html>
