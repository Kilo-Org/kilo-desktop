name: Publish Helper

on:
  workflow_call:
    inputs:
      release_channel:
        description: Publishable release channel (canary, staging, or prod)
        required: true
        type: string
      fail_fast:
        description: Cancel remaining matrix legs when one fails
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-${{ inputs.release_channel }}
  cancel-in-progress: false

jobs:
  notebook-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./plugins/notebook/actions/build-ui
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-ui-${{ github.sha }}
          path: plugins/notebook/build/notebook
          if-no-files-found: error

  publish:
    needs: notebook-ui
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    environment: ${{ inputs.release_channel }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      matrix:
        include:
          - target: mac
            runner: macos-latest
            timeout_minutes: 90
          - target: windows
            runner: windows-latest
            timeout_minutes: 60
          - target: linux
            runner: ubuntu-latest
            timeout_minutes: 60
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_DESIGN_SYSTEM_TOKEN }}
      RELEASE_CHANNEL: ${{ inputs.release_channel }}
      UPDATE_PUBLISH_URL: ${{ vars.UPDATE_PUBLISH_URL }}
      UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
      AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Linux maker prerequisites
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential fakeroot libsecret-1-dev pkg-config

      - name: Setup macOS code signing
        if: matrix.target == 'mac'
        uses: ./.github/actions/setup-macos-codesign
        with:
          certificate_base64: ${{ secrets.OSX_BUILD_CERTIFICATE_BASE64 }}
          certificate_password: ${{ secrets.OSX_P12_PASSWORD }}
          notarization_key: ${{ secrets.OSX_NOTARIZATION_KEY }}
          notarization_key_id: ${{ secrets.OSX_NOTARIZATION_KEY_ID }}
          notarization_key_issuer: ${{ secrets.OSX_NOTARIZATION_KEY_ISSUER }}

      - name: Setup Windows code signing
        if: matrix.target == 'windows'
        uses: ./.github/actions/setup-windows-codesign
        with:
          client_id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          key_vault_uri: ${{ secrets.AZURE_KEY_VAULT_URI }}
          cert_name: ${{ secrets.AZURE_CERT_NAME }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@bb84b6db015d7c3d879540350fdc17b85d6ad362
        with:
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: notebook-ui-${{ github.sha }}
          path: plugins/notebook/build/notebook

      - name: Publish
        run: pnpm run publish
