name: Cache Kilo CLI
description: >
  Restore the platform-specific Kilo v2 CLI (kilo2) staged by prepare-assets.
  The cache key tracks the package manifest and the lockfile, which fixes the
  kilo-v2 version the catalog resolves to.

runs:
  using: composite
  steps:
    - name: Cache Kilo CLI
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: plugins/core/resources/kilo
        key: kilo2-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugins/core/package.json', 'pnpm-lock.yaml') }}
        # The key changes with any lockfile change. An older CLI is safe to
        # restore: fetch-cli compares staged.json and re-stages a mismatch.
        restore-keys: |
          kilo2-cli-${{ runner.os }}-${{ runner.arch }}-
