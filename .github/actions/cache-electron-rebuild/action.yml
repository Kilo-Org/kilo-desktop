name: Cache Electron native rebuilds
description: >
  Restore the @electron/rebuild hash cache so packaging hosts skip compiling
  better-sqlite3, keytar, and @runtimed/node when Electron and native module
  versions are unchanged.

runs:
  using: composite
  steps:
    - name: Cache Electron rebuild artifacts
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: apps/desktop/.electron-rebuild-cache
        key: electron-rebuild-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
        restore-keys: |
          electron-rebuild-${{ runner.os }}-
